[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analisador-de-logs"
version = "1.0.0"
description = "Analisador de logs em Python puro: leitores de formatos comuns, linguagem de filtro própria, percentis e relatório de terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "condeDeveloper" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Logging",
]

[project.scripts]
logs = "logs.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["logs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
